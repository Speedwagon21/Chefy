<!DOCTYPE html>
<html lang="en" class="bg-amber-50/40">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Order homemade food from verified home cooks in your neighborhood.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chefy">
  <title>Chefy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fa/css/all.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-dvh text-slate-800 antialiased bg-amber-50/40">

  <header class="sticky top-0 z-40 glass safe-top border-b border-amber-100">
    <div class="max-w-md lg:max-w-6xl mx-auto px-4 lg:px-8 h-14 lg:h-16 flex items-center justify-between gap-2">
      <a href="#/" class="flex items-center gap-2.5" aria-label="Chefy home">
        <span class="w-9 h-9 bg-gradient-to-tr from-brand-600 to-brand-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-500/30">
          <i class="fa-solid fa-utensils" aria-hidden="true"></i>
        </span>
        <span id="headerTitle" class="text-lg font-black tracking-tight text-slate-900">Chefy</span>
      </a>
      <nav class="hidden lg:flex items-center gap-1 ml-6 mr-auto" aria-label="Main">
        <a href="#/" data-nav="eat" class="nav-top"><i class="fa-solid fa-house" aria-hidden="true"></i> Eat</a>
        <a href="#/orders" data-nav="orders" class="nav-top relative"><i class="fa-solid fa-receipt" aria-hidden="true"></i> Orders
          <span id="ordersDotD" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-brand-500 rounded-full"></span></a>
        <a href="#/kitchen" data-nav="kitchen" class="nav-top"><i class="fa-solid fa-kitchen-set" aria-hidden="true"></i> Kitchen
          <span id="kitchenBadgeD" class="hidden min-w-[1.25rem] h-5 px-1 bg-brand-600 text-white text-[11px] font-bold rounded-full items-center justify-center">0</span></a>
        <a href="#/account" data-nav="account" class="nav-top"><i class="fa-solid fa-circle-user" aria-hidden="true"></i> Account</a>
      </nav>
      <div id="headerRight" class="flex items-center gap-2"></div>
    </div>
  </header>

  <main id="view" class="max-w-md lg:max-w-6xl mx-auto px-4 lg:px-8 pt-4 lg:pt-8 pb-nav" tabindex="-1"></main>

  <div id="basketBar" class="hidden lg:!hidden fixed z-30 left-1/2 -translate-x-1/2 w-full max-w-md px-3" style="bottom: calc(4.75rem + env(safe-area-inset-bottom));">
    <button data-act="open-basket" class="w-full flex items-center justify-between gap-3 px-4 py-3.5 bg-brand-600 active:bg-brand-700 text-white rounded-2xl shadow-xl shadow-brand-600/30">
      <span class="flex items-center gap-2.5">
        <span id="basketBarCount" class="min-w-[1.5rem] h-6 px-1.5 bg-white/25 rounded-lg text-xs font-black flex items-center justify-center">0</span>
        <span class="text-sm font-bold">View basket</span>
      </span>
      <span id="basketBarTotal" class="text-sm font-black">$0.00</span>
    </button>
  </div>

  <nav class="lg:hidden fixed bottom-0 left-1/2 -translate-x-1/2 z-40 w-full max-w-md bg-white/95 border-t border-slate-200 safe-bottom" aria-label="Main tabs">
    <div class="grid grid-cols-4 h-16">
      <a href="#/" data-nav="eat" class="nav-btn flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-house text-lg" aria-hidden="true"></i><span class="text-[11px] font-bold">Eat</span>
      </a>
      <a href="#/orders" data-nav="orders" class="nav-btn relative flex flex-col items-center justify-center gap-1">
        <span class="relative"><i class="fa-solid fa-receipt text-lg" aria-hidden="true"></i>
          <span id="ordersDot" class="hidden absolute -top-1 -right-2 w-2.5 h-2.5 bg-brand-500 rounded-full border-2 border-white"></span></span>
        <span class="text-[11px] font-bold">Orders</span>
      </a>
      <a href="#/kitchen" data-nav="kitchen" class="nav-btn relative flex flex-col items-center justify-center gap-1">
        <span class="relative"><i class="fa-solid fa-kitchen-set text-lg" aria-hidden="true"></i>
          <span id="kitchenBadge" class="hidden absolute -top-2 -right-3 min-w-[1.15rem] h-[1.15rem] px-1 bg-brand-600 text-white text-[10px] font-bold rounded-full items-center justify-center border-2 border-white">0</span></span>
        <span class="text-[11px] font-bold">Kitchen</span>
      </a>
      <a href="#/account" data-nav="account" class="nav-btn flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-circle-user text-lg" aria-hidden="true"></i><span class="text-[11px] font-bold">Account</span>
      </a>
    </div>
  </nav>

  <div id="sheetRoot"></div>

  <div id="toast" role="status" aria-live="polite" class="hidden fixed left-1/2 -translate-x-1/2 z-[80] px-4 py-3 bg-slate-900 text-white text-xs font-semibold rounded-xl shadow-2xl items-center gap-2 max-w-[calc(100vw-2rem)]">
    <i class="fa-solid fa-circle-check text-emerald-400" aria-hidden="true"></i><span id="toastText"></span>
  </div>

  <script src="/app.js"></script>
</body>
</html>
