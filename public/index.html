<!DOCTYPE html>
<html lang="en" class="bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Order homemade food from verified home cooks in your neighborhood.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chefy">
  <title>Chefy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-600.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-700.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-900.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage-grotesque/latin-700.css">
  <link rel="stylesheet" href="/vendor/fa/css/all.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-dvh text-slate-800 antialiased bg-white">

  <header class="sticky top-0 z-40 glass safe-top">
    <div class="max-w-md md:max-w-3xl lg:max-w-6xl mx-auto px-4 md:px-6 lg:px-8 h-[4.5rem] lg:h-20 flex items-center justify-between gap-2">
      <a href="#/" class="flex items-center gap-2.5" aria-label="Chefy home">
        <img src="/logo.svg" alt="" class="h-10 w-auto" width="46" height="40">
        <span class="text-[1.85rem] font-[900] tracking-tight text-slate-900 leading-none font-sans">Chefy</span>
      </a>
      <nav class="hidden lg:flex items-center gap-1 ml-6 mr-auto" aria-label="Main">
        <a href="#/" data-nav="eat" class="nav-top">Home</a>
        <a href="#/orders" data-nav="orders" class="nav-top relative">Orders
          <span id="ordersDotD" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-brand-500 rounded-full"></span></a>
        <a href="#/saved" data-nav="saved" class="nav-top">Saved</a>
        <a href="#/kitchen" data-nav="kitchen" class="nav-top">Kitchen
          <span id="kitchenBadgeD" class="hidden min-w-[1.25rem] h-5 px-1 bg-brand-600 text-white text-xs font-bold rounded-full items-center justify-center">0</span></a>
      </nav>
      <div id="headerRight" class="flex items-center gap-2"></div>
    </div>
  </header>

  <noscript><p class="max-w-md mx-auto px-4 pt-8 text-slate-700">Chefy needs JavaScript to show menus and take orders. Turn it on in your browser settings, then reload this page.</p></noscript>
  <main id="view" class="max-w-md md:max-w-3xl lg:max-w-6xl mx-auto px-4 md:px-6 lg:px-8 pt-4 md:pt-6 lg:pt-8 pb-nav" tabindex="-1"></main>

  <div id="basketBar" class="hidden lg:!hidden fixed z-30 left-1/2 -translate-x-1/2 w-full max-w-md md:max-w-xl px-3">
    <button data-act="open-basket" class="w-full flex items-center justify-between gap-3 px-5 py-3.5 bg-slate-900 active:bg-slate-800 text-white rounded-full shadow-lg">
      <span class="flex items-center gap-2.5">
        <span id="basketBarCount" class="min-w-[1.5rem] h-6 px-1.5 bg-white/25 rounded-lg text-xs font-black flex items-center justify-center">0</span>
        <span class="text-sm font-bold">View basket</span>
      </span>
      <span id="basketBarTotal" class="text-sm font-black">$0.00</span>
    </button>
  </div>

  <nav id="tabBar" class="lg:hidden fixed bottom-0 left-1/2 -translate-x-1/2 z-40 w-full max-w-md md:max-w-xl bg-white border-t border-slate-200 rounded-t-3xl md:rounded-full md:border md:shadow-xl safe-bottom" aria-label="Main tabs">
    <div class="grid grid-cols-5 h-[4.75rem] items-center">
      <a href="#/" data-nav="eat" class="nav-btn h-full flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-house text-[22px]" aria-hidden="true"></i><span class="text-xs font-bold">Home</span>
      </a>
      <a href="#/orders" data-nav="orders" class="nav-btn h-full flex flex-col items-center justify-center gap-1">
        <span class="relative"><i class="fa-regular fa-calendar-check text-[22px]" aria-hidden="true"></i>
          <span id="ordersDot" class="hidden absolute -top-1 -right-2 w-2.5 h-2.5 bg-brand-500 rounded-full border-2 border-white"></span></span>
        <span class="text-xs font-bold">Orders</span>
      </a>
      <div class="flex justify-center">
        <button id="fab" data-act="fab" class="relative -mt-9 w-[4.25rem] h-[4.25rem] rounded-full bg-brand-500 active:bg-brand-600 text-white text-[1.7rem] shadow-lg ring-[5px] ring-white flex items-center justify-center" aria-label="Basket">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span id="fabBadge" class="hidden absolute -top-0.5 -right-0.5 min-w-[1.4rem] h-[1.4rem] px-1 bg-slate-900 text-white text-xs font-bold rounded-full items-center justify-center ring-2 ring-white">0</span>
        </button>
      </div>
      <a href="#/saved" data-nav="saved" class="nav-btn h-full flex flex-col items-center justify-center gap-1">
        <i class="fa-regular fa-bookmark text-[22px]" aria-hidden="true"></i><span class="text-xs font-bold">Saved</span>
      </a>
      <a href="#/kitchen" data-nav="kitchen" class="nav-btn h-full flex flex-col items-center justify-center gap-1">
        <span class="relative"><i class="fa-solid fa-kitchen-set text-[22px]" aria-hidden="true"></i>
          <span id="kitchenBadge" class="hidden absolute -top-2 -right-3 min-w-[1.15rem] h-[1.15rem] px-1 bg-brand-600 text-white text-xs font-bold rounded-full items-center justify-center border-2 border-white">0</span></span>
        <span class="text-xs font-bold">Kitchen</span>
      </a>
    </div>
  </nav>

  <div id="sheetRoot"></div>

  <div id="toast" role="status" aria-live="polite" class="hidden fixed left-1/2 -translate-x-1/2 z-[80] px-4 py-3 bg-slate-900 text-white text-sm font-semibold rounded-[10px] shadow-lg items-center gap-2 max-w-[calc(100vw-2rem)]">
    <i class="fa-solid fa-circle-check text-emerald-400" aria-hidden="true"></i><span id="toastText"></span>
  </div>

  <script src="/app.js"></script>
</body>
</html>
